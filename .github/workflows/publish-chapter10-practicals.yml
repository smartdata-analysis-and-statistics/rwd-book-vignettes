name: Publish Chapter 10 practicals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Chapter10/Practicals/**"
      - "Chapter10/data/README.md"
      - "_brand.html"
      - ".github/workflows/publish-chapter10-practicals.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chapter10-pages
  cancel-in-progress: true

jobs:
  build:
    # Use the runner's preinstalled R to avoid setup-r's apt system-package step.
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          install-r: false
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "MatchIt", "MatchThem", "mice", "cobalt", "marginaleffects", "dplyr", "ggplot2", "tidyr", "optmatch"))'

      - name: Render Chapter 10 site
        run: quarto render Chapter10/Practicals

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Chapter10/Practicals/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
