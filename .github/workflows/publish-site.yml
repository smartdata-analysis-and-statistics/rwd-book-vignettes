name: Publish practicals site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Chapter_3/**"
      - "Chapter10/**"
      - "_quarto.yml"
      - "index.qmd"
      - "_brand.html"
      - "sdas_large.png"
      - ".github/workflows/publish-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          install-r: false
          use-public-rspm: true

      - name: Install R packages used by the practicals
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "dplyr", "tidyr", "purrr", "ggplot2", "MatchIt", "MatchThem", "WeightIt", "optmatch", "survey", "tableone", "cobalt", "marginaleffects", "mice", "naniar"))'

      - name: Render complete Quarto website
        run: quarto render .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
