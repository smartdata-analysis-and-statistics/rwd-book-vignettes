  navbar:
    left:
      - href: index.qmd
        text: Overview
      - text: Data preparation and exploration
        menu:
          - href: chapter10_exploration_task.qmd
            text: Learner task
          - href: chapter10_exploration_solution.qmd
            text: Worked solution
      - text: Multiple imputation
        menu:
          - href: chapter10_homogeneous_treatment_effect_task.qmd
            text: Learner task
          - href: chapter10_homogeneous_treatment_effect_solution.qmd
            text: Worked solution

format:
  html:
